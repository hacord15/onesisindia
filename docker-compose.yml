name: onesis-cms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onesis_cms
    ports:
      - "5432:5432"
    volumes:
      - onesis_postgres_data:/var/lib/postgresql/data

volumes:
  onesis_postgres_data:
