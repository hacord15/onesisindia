<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to oneSIS</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; background: #fff; }

        /* Centre me bada logo */
        .center-logo {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 1.2s ease-in-out;
        }
        .center-logo img {
    width: min(90vw, 900px);   /* pehle: min(70vw, 520px) */
    height: auto;
    transition: transform 0.3s ease;
}
        .center-logo img:hover { transform: scale(1.05); }

        @keyframes fadeIn {
            0%   { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Curtains */
        .curtain {
            position: fixed;
            top: 0;
            width: 50%;
            height: 100vh;
            z-index: 1050;
            transition: transform 2s ease-in-out;
            will-change: transform;
            background-image:
                repeating-linear-gradient(90deg, rgba(255,255,255,0.07) 0, rgba(255,255,255,0.07) 15px, transparent 15px, transparent 40px),
                repeating-linear-gradient(90deg, transparent 0, transparent 25px, rgba(0,0,0,0.15) 25px, rgba(0,0,0,0.15) 35px, transparent 35px, transparent 50px),
                linear-gradient(to bottom, #8b0000, #b22222);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }
        .curtain.left  { left: 0; }
        .curtain.right { right: 0; }
        .curtain.open.left  { transform: translateX(-100%); pointer-events: none; }
        .curtain.open.right { transform: translateX(100%);  pointer-events: none; }

        /* Tap button */
        #tapButton {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.7);
            cursor: pointer;
            font-weight: 700;
            font-size: 20px;
            color: white;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0077cc, #00cc88, #ff6600);
            background-size: 200% 200%;
            animation: bgPulse 6s ease infinite, blink 2s infinite;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 1100;
        }
        #tapButton:hover {
            transform: translate(-50%, -50%) scale(1.2);
            box-shadow: 0 8px 16px rgba(0,0,0,0.35);
        }
        @keyframes bgPulse { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes blink   { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        @media (max-width: 767px) {
            #tapButton { width: 60px; height: 60px; font-size: 14px; }
        }
    </style>
</head>

<body>

    <!-- Curtains -->
    <div class="curtain left"></div>
    <div class="curtain right"></div>

    <!-- Tap button -->
    <button id="tapButton">Tap</button>

    <!-- Centre me bada logo -->
   <div class="center-logo">
    <img src="/assests/homepage/logo_oneSIS.jpeg" alt="OneSIS Logo" />
</div>

    <audio id="clapSound" src="clap.wav" preload="auto"></audio>

    <script>
        const leftCurtain  = document.querySelector('.curtain.left');
        const rightCurtain = document.querySelector('.curtain.right');
        const tapBtn       = document.getElementById('tapButton');
        const clapAudio    = document.getElementById('clapSound');

        const MAIN_URL = 'https://www.onesis.co.in/'; // main domain yahan badlo
        const REDIRECT_DELAY = 5000;                  // curtain khulte hi redirect

        tapBtn.addEventListener('click', () => {
            tapBtn.style.display = 'none';

            clapAudio.play().catch(e => console.log('Audio play prevented:', e));

            leftCurtain.classList.add('open');
            rightCurtain.classList.add('open');

            setTimeout(() => {
                leftCurtain.remove();
                rightCurtain.remove();
            }, 2100);

            // Confetti
            setTimeout(() => {
                const end = Date.now() + 1000;
                const colors = ['#bb0000', '#ffffff'];
                (function frame() {
                    confetti({ particleCount: 3, angle: 60,  spread: 55, origin: { x: 0 }, colors });
                    confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors });
                    if (Date.now() < end) requestAnimationFrame(frame);
                })();
            }, 1000);

            // Redirect
            setTimeout(() => {
                clapAudio.pause();
                clapAudio.currentTime = 0;
                window.location.replace(MAIN_URL);
            }, REDIRECT_DELAY);
        });
    </script>
</body>
</html>
